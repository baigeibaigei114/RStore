[project]
name = "ndvi-agent-service"
version = "0.1.0"
description = "Internal bounded NDVI decision and builtin-knowledge RAG service"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi==0.143.0", "uvicorn==0.54.0", "langchain==1.4.4",
  "langchain-deepseek==1.1.1", "langchain-huggingface==1.2.3",
  "sentence-transformers==6.1.0", "torch==2.14.1+cpu", "transformers==5.19.0",
  "psycopg[binary]==3.3.6", "pgvector==0.5.1", "PyYAML==6.0.3", "httpx2==2.13.1",
]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.17.0", "mypy==2.4.0", "types-PyYAML"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: real embedding and isolated PostgreSQL required"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
files = ["app"]
