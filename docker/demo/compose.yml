name: rs-demo

services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_DB: rs_demo
      POSTGRES_USER: rsdemo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?set DEMO_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U rsdemo -d rs_demo"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4
    restart: unless-stopped
    mem_limit: 128m
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "96mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data

  rabbitmq:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    mem_limit: 384m
    environment:
      RABBITMQ_DEFAULT_USER: rsdemo
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "+S 2:2"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    restart: unless-stopped
    mem_limit: 512m
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_USERNAME:-ndvi-demo}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?set MINIO_PASSWORD}
    volumes:
      - minio-data:/data

  geoserver:
    image: kartoza/geoserver:2.25.2
    restart: unless-stopped
    mem_limit: 1280m
    environment:
      GEOSERVER_ADMIN_USER: rsdemo
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_PASSWORD:?set GEOSERVER_PASSWORD}
      INITIAL_MEMORY: 128M
      MAXIMUM_MEMORY: 768M
    networks: [private-map]
    volumes:
      - geoserver-data:/opt/geoserver/data_dir
      - /opt/ndvi-demo/shared-raster:/opt/geoserver/raster-data:ro

  backend:
    image: rs-demo-backend:${RELEASE_TAG:?set RELEASE_TAG}
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 1536m
    networks: [default, private-map]
    environment:
      SPRING_PROFILES_ACTIVE: demo
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx768m"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/rs_demo
      SPRING_DATASOURCE_USERNAME: rsapp
      SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "5"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "1"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: rsdemo
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}
      APP_AUTH_JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      APP_AUTH_WORKER_TOKEN: ${WORKER_TOKEN:?set WORKER_TOKEN}
      APP_AUTH_DEV_USER_HEADER_ENABLED: "false"
      APP_AI_ENABLED: "false"
      INGESTION_ENABLED: "false"
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: https://rs-api.example.com
      MINIO_REGION: us-east-1
      MINIO_ACCESS_KEY: ${MINIO_USERNAME:-ndvi-demo}
      MINIO_SECRET_KEY: ${MINIO_PASSWORD:?set MINIO_PASSWORD}
      MINIO_BUCKET_NAME: remote-sensing-images
      GEOSERVER_URL: http://geoserver:8080/geoserver
      GEOSERVER_USERNAME: rsdemo
      GEOSERVER_PASSWORD: ${GEOSERVER_PASSWORD:?set GEOSERVER_PASSWORD}
      GEOSERVER_SHARED_DATA_LOCAL_DIR: /app/data/geoserver-raster
      GEOSERVER_SHARED_DATA_GEOSERVER_DIR: /opt/geoserver/raster-data
      PYTHON_WORKER_PYTHON_EXECUTABLE: python
      PYTHON_WORKER_PARSE_METADATA_SCRIPT: /app/python-worker/scripts/parse_metadata.py
      PYTHON_WORKER_THUMBNAIL_SCRIPT: /app/python-worker/scripts/generate_thumbnail.py
    volumes:
      - /opt/ndvi-demo/shared-raster:/app/data/geoserver-raster
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      redis: {condition: service_started}
      minio: {condition: service_started}
      geoserver: {condition: service_started}
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1',8080),3).close()"]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 20

  worker:
    image: rs-demo-worker:${RELEASE_TAG:?set RELEASE_TAG}
    build:
      context: ./worker
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 2048m
    cpus: 2.0
    environment:
      INGESTION_ENABLED: "false"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: rsdemo
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}
      RABBITMQ_QUEUE: rs.task.queue
      RABBITMQ_PREFETCH_COUNT: "1"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_USERNAME:-ndvi-demo}
      MINIO_SECRET_KEY: ${MINIO_PASSWORD:?set MINIO_PASSWORD}
      MINIO_SECURE: "false"
      BACKEND_BASE_URL: http://backend:8080
      WORKER_TOKEN: ${WORKER_TOKEN:?set WORKER_TOKEN}
      WORKER_TEMP_DIR: /work/tmp
    volumes:
      - worker-tmp:/work/tmp
    depends_on:
      backend: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}

  gateway:
    image: nginx:1.28-alpine
    restart: unless-stopped
    mem_limit: 64m
    environment:
      FRONTEND_ORIGIN: https://demo.example.com
      NGINX_ENVSUBST_FILTER: FRONTEND_ORIGIN
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - ./gateway.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      backend: {condition: service_healthy}

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  minio-data:
  geoserver-data:
  worker-tmp:

networks:
  private-map:
    internal: true
