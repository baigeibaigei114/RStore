services:
  backend:
    environment:
      TINYCD_ENABLED: ${TINYCD_ENABLED:-false}
      TINYCD_SAMPLE_BEFORE: ${TINYCD_SAMPLE_BEFORE:-}
      TINYCD_SAMPLE_AFTER: ${TINYCD_SAMPLE_AFTER:-}
      TINYCD_QUEUE: ${TINYCD_QUEUE:-rs.task.building-change.queue}

  tinycd-worker:
    profiles: [tinycd]
    build:
      context: ./python-worker
      dockerfile: Dockerfile
      target: tinycd-worker
    mem_limit: 2g
    cpus: 2.0
    restart: unless-stopped
    environment:
      WORKER_TASK_PROFILE: tinycd
      WORKER_TEMP_DIR: /tmp/tinycd
      TINYCD_WEIGHTS: /opt/tinycd/levir_best.pth
      PYTHONPATH: /opt/tinycd/source
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_QUEUE: ${TINYCD_QUEUE:-rs.task.building-change.queue}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${TINYCD_MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${TINYCD_MINIO_SECRET_KEY:-minioadmin}
      MINIO_SECURE: "false"
      BACKEND_BASE_URL: http://backend:8080
      WORKER_TOKEN: ${TINYCD_WORKER_TOKEN:-dev-worker-token-change-me}
    volumes:
      - type: bind
        source: ${TINYCD_SOURCE_DIR:?set the pinned TinyCD source directory}
        target: /opt/tinycd/source
        read_only: true
      - type: bind
        source: ${TINYCD_WEIGHTS_FILE:?set the fixed LEVIR-CD checkpoint file}
        target: /opt/tinycd/levir_best.pth
        read_only: true
    depends_on:
      - backend
      - rabbitmq
      - minio
