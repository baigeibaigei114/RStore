version: 1
project: intelligent-remote-sensing-platform
source_spec: shared/specs/agent-rag-spec.md
updated_at: '2026-09-17'

workflow:
  statuses:
    - backlog
    - ready
    - in_progress
    - review
    - blocked
    - done
  rules:
    - Only ready items with completed dependencies may be claimed.
    - One work item has exactly one owner while in progress.
    - Claimed paths may not overlap another in-progress item.
    - Milestones must be split into small work items before implementation.
    - Done requires recorded validation and a self-contained handoff.

milestones:
  - id: M1
    title: 数据库与容器基础
    implementation_step: 1
    depends_on: []
  - id: M2
    title: Agent Service 骨架
    implementation_step: 2
    depends_on: [M1]
  - id: M3
    title: 知识入库
    implementation_step: 3
    depends_on: [M1, M2]
  - id: M4
    title: RAG 与评测
    implementation_step: 4
    depends_on: [M3]
  - id: M5
    title: 计划生成与后端校验
    implementation_step: 5
    depends_on: [M4]
  - id: M6
    title: 受控执行器
    implementation_step: 6
    depends_on: [M5]
  - id: M7
    title: 报告与前端
    implementation_step: 7
    depends_on: [M4, M6]
  - id: M8
    title: 联调、验收与文档
    implementation_step: 8
    depends_on: [M1, M2, M3, M4, M5, M6, M7]

